<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Master Execution Plan — Dashboard Generator</title>
<style>
  :root{
    --navy:#383e42;
    --navy-dark:#202426;
    --teal:#0e9aa7;
    --orange:#861a22;
    --green:#3aa655;
    --purple:#8e5fd6;
    --gold:#e0a815;
    --paper:#f4f6f9;
    --card:#ffffff;
    --ink:#1c2b3a;
    --muted:#6b7c8f;
    --line:#e1e7ee;
    --customer:#1f6fd6;
    --east:#861a22;
    --sac:#383e42;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);}
  .app{display:flex;min-height:100vh;align-items:flex-start;}
  .editor{
    width:420px;flex:0 0 420px;background:var(--navy-dark);color:#dce6f0;
    padding:20px;
  }
  .editor h1{font-size:16px;color:#fff;margin:0 0 4px;letter-spacing:.5px;}
  .editor p.hint{font-size:12px;color:#9fb2c6;margin:0 0 18px;line-height:1.5;}
  .editor .section{background:#2b3033;border-radius:10px;padding:14px;margin-bottom:12px;}
  .editor .section > summary{cursor:pointer;font-weight:600;font-size:13px;color:#fff;padding:2px 0;}
  .editor label{display:block;font-size:11px;color:#9fb2c6;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px;}
  .editor input[type=text],.editor input[type=number],.editor textarea,.editor select{
    width:100%;padding:7px 8px;border-radius:6px;border:1px solid #4a5256;background:#16181a;color:#fff;font-size:13px;
  }
  .editor textarea{resize:vertical;min-height:54px;font-family:inherit;}
  .row2{display:flex;gap:8px;}
  .row2 > div{flex:1;}
  .row3{display:flex;gap:6px;}
  .row3 > div{flex:1;}
  .miniBtn{
    background:#4a5256;border:none;color:#dce6f0;padding:5px 9px;border-radius:6px;font-size:11px;cursor:pointer;margin-top:6px;
  }
  .miniBtn:hover{background:#5c6469;}
  .delBtn{background:#7a1f26;}
  .delBtn:hover{background:#9c2530;}
  .genBtn{
    position:sticky;bottom:0;width:100%;padding:12px;background:var(--orange);color:#fff;border:none;
    font-weight:700;font-size:14px;border-radius:8px;cursor:pointer;margin-top:10px;letter-spacing:.4px;
  }
  .genBtn:hover{background:#a3232e;}
  .repeatItem{border:1px solid #4a5256;border-radius:8px;padding:8px;margin-top:8px;background:#16181a;}
  .rowHead{display:flex;justify-content:space-between;align-items:center;}
  .rowHead span{font-size:11px;color:#7fa0c4;}

  .stage{flex:1;min-width:0;padding:28px 34px;overflow-x:auto;overflow-y:auto;}
  #poster{max-width:1300px;width:100%;margin:26px auto 0;background:var(--card);border-radius:14px;box-shadow:0 4px 30px rgba(20,40,70,.12);overflow:visible;}

  .p-header{background:linear-gradient(135deg,var(--navy),#4c5760);color:#fff;padding:22px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;}
  .p-header .logoblock{display:flex;align-items:center;flex:0 0 auto;}
  .p-header .logoblock img{max-height:78px;max-width:260px;background:#fff;border-radius:8px;padding:8px 14px;object-fit:contain;}
  .p-header .titleblock{flex:1;min-width:220px;}
  .p-header .titleblock .code{font-size:12px;letter-spacing:2px;color:#9fc4ee;font-weight:600;}
  .p-header .titleblock h2{margin:2px 0 0;font-size:26px;letter-spacing:.5px;}
  .p-header .metablock{display:flex;gap:22px;font-size:12px;flex-wrap:wrap;}
  .p-header .metablock div{background:rgba(255,255,255,.08);padding:8px 14px;border-radius:8px;text-align:center;min-width:130px;}
  .p-header .metablock b{display:block;font-size:14px;}

  .p-kpi{display:flex;background:var(--navy);color:#fff;overflow-x:auto;}
  .p-kpi .kcard{flex:1;min-width:150px;padding:14px 16px;text-align:center;border-right:1px solid rgba(255,255,255,.08);}
  .p-kpi .kcard:last-child{border-right:none;}
  .p-kpi .kicon{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
  .p-kpi .kicon svg{width:18px;height:18px;stroke:var(--gold);}
  .p-kpi .kcard .kval{font-size:22px;font-weight:800;color:var(--gold);}
  .p-kpi .kcard .klabel{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#b9c9db;margin-top:2px;}
  .p-kpi .kcard .ksub{font-size:10px;color:#7f93a8;}

  .p-sections{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:22px 20px;align-items:stretch;}
  .p-sections .scard{min-width:0;overflow:hidden;}
  @media (max-width:1200px){
    .p-sections{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  @media (max-width:1000px){
    .p-sections{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width:600px){
    .p-sections{grid-template-columns:1fr;}
  }
  .scard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;background:#fbfcfe;height:100%;min-height:0;}
  .scard .shead{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;min-height:48px;}
  .scard .sbadge{width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 26px;margin-top:2px;}
  .scard .shead .stext{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;}
  .scard .sicon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 34px;margin-left:auto;}
  .scard .sicon svg{width:19px;height:19px;stroke:#fff;}
  .scard .stitle{font-size:12px;font-weight:700;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .scard .ssub{font-size:10px;color:var(--muted);line-height:1.3;min-height:1.3em;margin-top:2px;}
  .scard ul{list-style:none;margin:6px 0;padding:0;flex:1 1 auto;}
  .scard ul li{font-size:11.5px;padding:3px 0;border-top:1px dashed var(--line);display:flex;gap:6px;align-items:flex-start;}
  .scard ul li:first-child{border-top:none;}
  .scard ul li:before{content:"✓";color:var(--green);font-weight:700;flex:0 0 auto;}
  .scard .sfoot{margin-top:auto;border-top:2px solid var(--line);padding-top:6px;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:36px;}
  .scard .sfoot .fval{font-weight:800;font-size:14px;line-height:1.2;text-align:right;}
  .scard .sfoot .flabel{font-size:9px;color:var(--muted);text-transform:uppercase;flex:0 0 auto;}
  .tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;}

  .p-chart{padding:10px 26px 26px;}
  .p-chart h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);margin:0 0 10px;}
  .chartbox{border:1px solid var(--line);border-radius:10px;padding:10px 16px;}

  .p-disc{padding:0 26px 10px;}
  .disc-row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;margin-bottom:6px;}
  .disc-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;}
  .disc-dot{width:10px;height:10px;border-radius:3px;}
  .disc-track{position:relative;height:22px;background:#eef2f6;border-radius:6px;}
  .disc-bar{position:absolute;top:0;bottom:0;border-radius:6px;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:flex-start;font-weight:600;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .disc-months{display:grid;grid-template-columns:150px 1fr;margin-top:4px;}
  .disc-months .ml{grid-column:2;display:grid;font-size:9px;color:var(--muted);}

  .p-bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:0;border-top:1px solid var(--line);}
  .p-notes{padding:18px 26px;border-right:1px solid var(--line);}
  .p-notes h4{font-size:12px;color:var(--navy);margin:0 0 6px;}
  .p-notes p{font-size:11.5px;color:var(--muted);line-height:1.5;margin:0 0 10px;}
  .p-assump h4{font-size:12px;color:var(--navy);margin:14px 0 6px;}
  .assump-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;}
  .assump-grid div{font-size:11px;display:flex;gap:5px;align-items:flex-start;}
  .assump-grid div:before{content:"✓";color:var(--green);font-weight:700;}

  .p-scope{padding:18px 26px;}
  .p-scope h4{font-size:12px;color:var(--navy);margin:0 0 8px;}
  .scope-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;}
  .scope-grid div{font-size:11px;display:flex;gap:5px;align-items:flex-start;}
  .scope-grid div:before{content:"✓";color:var(--green);font-weight:700;}
  .p-exclusions{
    margin:0 26px 18px;padding:14px 16px;border-radius:10px;
    background:linear-gradient(135deg,#fdf6f6 0%,#faf7f7 100%);
    border:1px solid #f0d4d6;border-left:4px solid var(--orange);
  }
  .p-exclusions h4{
    margin:0 0 10px;font-size:12px;color:var(--orange);letter-spacing:.5px;
    text-transform:uppercase;display:flex;align-items:center;gap:8px;
  }
  .p-exclusions h4 .excl-badge{
    font-size:9px;font-weight:700;background:var(--orange);color:#fff;
    padding:2px 8px;border-radius:10px;letter-spacing:.3px;
  }
  .excl-grid{display:flex;flex-wrap:wrap;gap:6px 8px;}
  .excl-grid div{
    font-size:11px;display:inline-flex;align-items:center;gap:5px;
    color:#5a3a3a;background:#fff;border:1px solid #f0d4d6;
    padding:5px 10px;border-radius:6px;line-height:1.3;
  }
  .excl-grid div:before{content:"✕";color:var(--orange);font-weight:700;font-size:10px;}
  .legend{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .legend span{font-size:10px;font-weight:700;color:#fff;padding:3px 9px;border-radius:5px;}

  html[dir="rtl"] body{direction:rtl;text-align:right;}
  html[dir="rtl"] .p-header{flex-direction:row-reverse;}
  html[dir="rtl"] .cover{flex-direction:row-reverse;}
  html[dir="rtl"] .cov-right .cov-photo{clip-path:polygon(0 0, 88% 0, 100% 100%, 0% 100%);}
  html[dir="rtl"] .cov-right .cov-diag{left:auto;right:0;background:linear-gradient(260deg, #fff 48%, transparent 50%);}
  html[dir="rtl"] .disc-row{grid-template-columns:1fr 150px;}
  html[dir="rtl"] .disc-label{order:2;}
  html[dir="rtl"] table th,html[dir="rtl"] table td{text-align:right;}
  html[dir="rtl"] .costtable td.clabel,html[dir="rtl"] .paytable td.plabel{text-align:right;}

  @media print{
    @page{ size:A4 portrait; margin:10mm; }
    html, body{
      background:#fff !important;
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
    }
    .editor, .menuToggle, .editorEdgeGrip, .editorOverlay, .dragHandle,
    #loginGate, .genBtn{ display:none !important; }
    .app{ display:block !important; }
    .stage{ padding:0 !important; margin:0 !important; overflow:visible !important; width:100% !important; }
    .block, #poster, #coverBlock, #rolesBlock, #chartsBlock, #costBlock, #paymentBlock{
      box-shadow:none !important; border-radius:0 !important;
      margin:0 auto 6mm !important; max-width:100% !important;
      page-break-inside:avoid; break-inside:avoid;
    }
    #coverBlock, #poster, #rolesBlock, #chartsBlock, #costBlock{
      page-break-after:always; break-after:page;
    }
    #paymentBlock{ page-break-after:auto; break-after:auto; }
    .slide-hidden{display:none !important;}
    .p-sections{ grid-template-columns:repeat(2, 1fr) !important; }
    svg{ max-width:100% !important; height:auto !important; }
  }
  @media (max-width:1000px){
    .p-sections{grid-template-columns:repeat(2,1fr);}
  }


  /* ---- Login gate + account bar ---- */
  #loginGate{
    position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#1a1e22 0%,#2b3033 50%,#202426 100%);
    font-family:inherit;
  }
  #loginGate.hidden{display:none !important;}
  .loginCard{
    width:min(400px,92vw);background:#fff;border-radius:16px;padding:28px 26px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);color:#1c2b3a;
  }
  .loginCard h2{margin:0 0 4px;font-size:20px;color:#202426;}
  .loginCard .sub{font-size:12px;color:#6b7c8f;margin:0 0 18px;line-height:1.45;}
  .loginCard label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#6b7c8f;margin:10px 0 4px;}
  .loginCard input,.loginCard select{
    width:100%;padding:10px 12px;border:1px solid #e1e7ee;border-radius:8px;font-size:14px;
    background:#f8fafc;color:#1c2b3a;box-sizing:border-box;
  }
  .loginCard input:focus,.loginCard select:focus{outline:none;border-color:#0e9aa7;background:#fff;}
  .loginCard .loginBtn{
    width:100%;margin-top:16px;padding:12px;border:none;border-radius:8px;background:#861a22;color:#fff;
    font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.3px;
  }
  .loginCard .loginBtn:hover{background:#a3232e;}
  .loginCard .err{color:#861a22;font-size:12px;margin-top:10px;min-height:16px;}
  .loginCard .hintBox{
    margin-top:14px;padding:10px 12px;background:#f4f6f9;border-radius:8px;font-size:11px;color:#6b7c8f;line-height:1.5;
  }
  .loginCard .hintBox b{color:#1c2b3a;}
  .userBar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    background:#16181a;border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:11px;color:#9fb2c6;
  }
  .userBar .ub-name{color:#fff;font-weight:700;}
  .userBar .ub-role{
    font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;color:#fff;text-transform:uppercase;letter-spacing:.4px;
  }
  .userBar .ub-role.admin{background:#861a22;}
  .userBar .ub-role.junior{background:#0e9aa7;}
  .userBar button{
    background:#4a5256;border:none;color:#dce6f0;padding:4px 9px;border-radius:6px;font-size:11px;cursor:pointer;
  }
  .userBar button:hover{background:#5c6469;}
  /* Removed body.locked visibility hack — was causing scale issues on mobile */

  /* ---- swipeable left-side editor drawer, always pinned in view while scrolling ---- */
  .menuToggle{
    display:flex;position:fixed;top:50%;left:16px;z-index:1002;
    width:40px;height:40px;border-radius:50%;background:rgba(17,20,23,.94);color:#fff;
    border:1px solid rgba(255,255,255,.1);align-items:center;justify-content:center;
    box-shadow:0 4px 18px rgba(0,0,0,.35), 0 0 0 0 rgba(14,154,167,.0);
    cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transform:translateY(-50%);
    transition:left .28s cubic-bezier(.22,.9,.32,1), background .2s ease, box-shadow .25s ease, transform .2s ease;
  }
  .menuToggle:hover{
    background:#1c2228;
    box-shadow:0 6px 22px rgba(0,0,0,.4), 0 0 0 4px rgba(14,154,167,.18);
    transform:translateY(-50%) scale(1.06);
  }
  .menuToggle:active{
    transform:translateY(-50%) scale(0.96);
    box-shadow:0 2px 10px rgba(0,0,0,.3);
  }
  .menuToggle svg{
    width:20px;height:20px;
    transition:transform .32s cubic-bezier(.22,.9,.32,1);
  }
  body.panel-open .menuToggle{
    background:rgba(32,36,38,.96);
    border-color:rgba(255,255,255,.14);
    box-shadow:0 4px 18px rgba(0,0,0,.4), 0 0 0 3px rgba(134,26,34,.2);
  }
  body.panel-open .menuToggle svg{
    transform:rotate(180deg);
  }
  body.panel-open .menuToggle:hover{
    box-shadow:0 6px 22px rgba(0,0,0,.45), 0 0 0 4px rgba(134,26,34,.28);
    transform:translateY(-50%) scale(1.06);
  }
  /* subtle idle pulse so it feels active when closed */
  @keyframes menuPulse{
    0%,100%{box-shadow:0 4px 18px rgba(0,0,0,.35), 0 0 0 0 rgba(14,154,167,.0);}
    50%{box-shadow:0 4px 18px rgba(0,0,0,.35), 0 0 0 6px rgba(14,154,167,.12);}
  }
  body:not(.panel-open) .menuToggle{
    animation:menuPulse 2.4s ease-in-out infinite;
  }
  body:not(.panel-open) .menuToggle:hover{
    animation:none;
  }
.editorOverlay{display:none;}
  .editorEdgeGrip{
    display:block;position:fixed;top:0;left:0;width:18px;height:100%;z-index:999;cursor:pointer;
  }
  .dragHandle{display:none;}
  .app{display:flex;min-height:100vh;align-items:flex-start;}
  .editor{
    position:sticky;top:0;
    height:100vh;max-height:100vh;
    width:0;max-width:420px;flex:0 0 0;
    padding:0;overflow:hidden;overflow-x:hidden;
    transition:flex-basis .28s cubic-bezier(.22,.9,.32,1),width .28s cubic-bezier(.22,.9,.32,1);
    box-shadow:none;
  }
  .editor.open{
    width:420px;max-width:88vw;flex:0 0 420px;
    overflow-y:auto;overflow-x:hidden;
    box-shadow:6px 0 24px rgba(0,0,0,.35);
  }
  .editorInner{width:100%;padding:20px;box-sizing:border-box;}
  .stage{padding:20px 14px 40px;padding-top:66px;}
  @media (min-width:901px){
    .stage{padding:28px 34px 40px;padding-top:70px;}
  }

  /* ---- detailed manpower & crane table + analytics ---- */
  .block{max-width:1300px;margin:22px auto 0;background:var(--card);border-radius:14px;box-shadow:0 4px 30px rgba(20,40,70,.12);overflow:hidden;}
  #poster, #coverBlock{max-width:1300px;margin-left:auto;margin-right:auto;}
  .block-head{background:var(--navy);color:#fff;padding:14px 22px;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .block-head small{font-weight:400;text-transform:none;color:#9fc4ee;letter-spacing:0;font-size:11px;}
  .block-head .bh-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .block-head .bh-logo{height:28px;max-width:110px;object-fit:contain;background:#fff;border-radius:5px;padding:3px 8px;flex:0 0 auto;}
  .block-body{padding:18px 22px;overflow-x:auto;}
  table.rtable{border-collapse:collapse;font-size:11px;width:100%;min-width:1200px;}
  table.rtable th,table.rtable td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap;}
  table.rtable th{background:#eef2f6;color:var(--navy);font-size:9.5px;text-transform:uppercase;position:sticky;top:0;}
  table.rtable td.rname{text-align:left;min-width:170px;font-weight:600;}
  table.rtable td.rassigned{min-width:90px;}
  table.rtable input.cellnum{width:34px;border:1px solid var(--line);border-radius:4px;text-align:center;font-size:11px;padding:2px;}
  table.rtable input.cellname{width:100%;border:1px solid transparent;background:transparent;font-size:11px;font-weight:600;padding:2px;}
  table.rtable input.cellname:focus,table.rtable input.cellnum:focus{border-color:var(--teal);background:#fff;outline:none;}
  .chip{display:inline-block;font-size:9.5px;font-weight:700;color:#fff;padding:2px 7px;border-radius:9px;}
  .disc-group-row td{font-weight:800;font-size:10px;text-transform:uppercase;color:#fff;text-align:left !important;}
  .totals-row td{background:#f4f6f9;font-weight:800;}
  .grand-row td{background:var(--navy);color:#fff;font-weight:800;}
  .rm-role{background:none;border:none;color:#c0392b;cursor:pointer;font-size:13px;}
  .tableToolbar{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}
  .tableToolbar .miniBtn{margin-top:0;background:var(--teal);color:#fff;}
  .tableToolbar .miniBtn:hover{background:#0c8591;}
  .tableToolbar label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .tableToolbar input[type=number]{width:60px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;}

  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .chart-card{border:1px solid var(--line);border-radius:10px;padding:12px;}
  .chart-card h5{margin:0 0 8px;font-size:11.5px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;}
  @media (max-width:900px){.charts-grid{grid-template-columns:1fr;}}

  .cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 22px;}
  @media (max-width:900px){.cost-grid{grid-template-columns:1fr;}}
  .cost-highlight{grid-column:1 / -1;display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--navy),var(--navy-dark));color:#fff;border-radius:12px;padding:16px 22px;}
  .cost-highlight .chi-icon{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:0 0 52px;}
